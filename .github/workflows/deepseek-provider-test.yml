name: ABFINI DeepSeek Provider Test

on:
  workflow_dispatch:
  push:
    paths:
      - 'models/**'
      - '.github/workflows/deepseek-provider-test.yml'

jobs:
  provider-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run offline DeepSeek provider test
        run: python -m models.test_deepseek
