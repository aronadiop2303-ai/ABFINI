name: Embedding Smoke Test

on:
  workflow_dispatch:
  push:
    paths:
      - 'embeddings/**'
      - '.github/workflows/embedding-smoke-test.yml'
  pull_request:
    paths:
      - 'embeddings/**'
      - '.github/workflows/embedding-smoke-test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r embeddings/requirements.txt
      - name: Run embedding smoke test
        run: python -m embeddings.run_test
