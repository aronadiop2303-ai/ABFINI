name: ABFINI Open Model Provider Test

on:
  workflow_dispatch:
  push:
    paths:
      - 'models/**'
      - '.github/workflows/open-model-test.yml'

jobs:
  open-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run deterministic OpenRouter provider test
        run: python -m models.test_openrouter
      - name: Run model router test
        run: python -m models.test_router
