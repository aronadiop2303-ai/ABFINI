name: ABFINI RAG End-to-End Test

on:
  workflow_dispatch:
  push:
    paths:
      - 'rag/**'
      - 'search/**'
      - 'embeddings/**'
      - 'supabase/migrations/**'
      - '.github/workflows/rag-e2e-test.yml'

jobs:
  rag-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r embeddings/requirements.txt
      - name: Run real RAG retrieval against Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EMBEDDING_MODEL: BAAI/bge-base-en-v1.5
          RAG_QUERY: "Qu'est-ce qu'ABFINI ?"
          RAG_THRESHOLD: "0.0"
          RAG_TOP_K: "5"
          RAG_MAX_CHARS: "12000"
        run: python -m rag.e2e_supabase_test
