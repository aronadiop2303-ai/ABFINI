name: ABFINI Semantic Search Test

on:
  workflow_dispatch:
  push:
    paths:
      - 'embeddings/semantic_search.py'
      - 'embeddings/provider.py'
      - 'embeddings/local_sentence_transformers.py'
      - 'embeddings/requirements.txt'
      - '.github/workflows/semantic-search-test.yml'

jobs:
  semantic-search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r embeddings/requirements.txt

      - name: Run semantic search against Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EMBEDDING_MODEL: BAAI/bge-base-en-v1.5
          SEMANTIC_QUERY: "Qu'est-ce qu'ABFINI ?"
          MATCH_THRESHOLD: "0.0"
          MATCH_COUNT: "5"
        run: python -m embeddings.semantic_search
